; ============================================================================
; Air Mouse - ESP32-S3 Super Mini
; PlatformIO configuration
; ============================================================================

[env:esp32-s3-super-mini]
; Pin the official PlatformIO Espressif32 platform to the Arduino-ESP32 2.0.17
; generation. The ESP32-BLE-Combo library used by this project was written
; against the older ESP32 BLE/HID headers and is not compatible with the
; Arduino-ESP32 3.x HID type declarations without patching the library itself.
platform  = espressif32@6.8.1
board     = esp32-s3-devkitc-1
framework = arduino

; ---------------------------------------------------------------------------
; Flash / partition
; ---------------------------------------------------------------------------
board_build.flash_mode  = qio
board_upload.flash_size = 4MB
board_build.partitions  = default.csv

; ---------------------------------------------------------------------------
; Native USB CDC
; ---------------------------------------------------------------------------
; ESP32-S3 USB mode:
;   0 = USB device / TinyUSB (correct mode for native USB CDC)
;   1 = USB OTG/host mode
;
; The previous project used ARDUINO_USB_MODE=1 while expecting the native USB
; port to behave as a CDC serial device. That setting is for OTG/host mode.
; Keep CDC on at boot, but use USB device mode here.
; ---------------------------------------------------------------------------
build_unflags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=0

build_flags =
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USE_NIMBLE

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Libraries
; ---------------------------------------------------------------------------
; ESP32-BLE-Combo already contains the combined BLE HID implementation.
; NimBLE-Arduino is its lightweight BLE backend when USE_NIMBLE is enabled.
; MPU9250 is the IMU driver.
; ---------------------------------------------------------------------------
lib_deps =
    https://github.com/Georgegipa/ESP32-BLE-Combo.git
    h2zero/NimBLE-Arduino @ ^1.4.1
    https://github.com/hideakitai/MPU9250.git
