; ============================================================================
;  PROYEK   : Air Mouse - ESP32-S3 Super Mini
;  DESKRIPSI: Konfigurasi PlatformIO untuk perangkat Air Mouse yang berperan
;             ganda sebagai BLE Mouse + BLE Keyboard (dengan Media Keys),
;             dipadukan sensor gerak 9-axis MPU9250 dan 4 sensor sentuh jari.
;
;  Dokumentasi lengkap opsi platformio.ini:
;  https://docs.platformio.org/page/projectconf.html
; ============================================================================

[env:esp32-s3-super-mini]
platform  = espressif32
; "esp32-s3-devkitc-1" adalah definisi board generik ESP32-S3 di PlatformIO
; yang paling kompatibel dipakai untuk board-board klon "ESP32-S3 Super Mini"
; (chip & pinout sama, hanya form factor yang berbeda).
board     = esp32-s3-devkitc-1
framework = arduino

; ---------------------------------------------------------------------------
; Flash & Partisi
; Mayoritas board "ESP32-S3 Super Mini" beredar dengan flash 4MB tanpa PSRAM.
; Jika board Anda memiliki PSRAM, silakan sesuaikan/tambahkan
; "-D BOARD_HAS_PSRAM" pada build_flags di bawah.
; ---------------------------------------------------------------------------
board_build.flash_mode  = qio
board_upload.flash_size = 4MB
board_build.partitions  = default.csv

; ---------------------------------------------------------------------------
; Build Flags
;  - ARDUINO_USB_MODE + ARDUINO_USB_CDC_ON_BOOT : WAJIB agar port USB native
;    ESP32-S3 langsung berfungsi sebagai Serial Monitor tanpa chip USB-UART
;    tambahan (khas semua board "Super Mini").
;  - USE_NIMBLE : mengaktifkan mode NimBLE pada library BLE Combo di bawah,
;    yang secara signifikan menghemat pemakaian RAM & Flash dibanding BLE
;    stack bawaan (Bluedroid) -- sangat membantu karena ESP32-S3 Super Mini
;    hanya punya Flash 4MB dan harus berbagi memori dengan library MPU9250.
; ---------------------------------------------------------------------------
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D USE_NIMBLE

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Dependensi Library
;  1) ESP32-BLE-Combo (fork Georgegipa) -> menyediakan SATU perangkat BLE HID
;     gabungan (Mouse + Keyboard + Media/Consumer Keys) sehingga Windows &
;     Android cukup memasangkan (pairing) SATU device "Air Mouse" saja.
;     (Menggunakan dua library terpisah T-vK BLE-Mouse & BLE-Keyboard TIDAK
;     bisa dipakai bersamaan karena masing-masing membuat server BLE HID
;     sendiri dan akan bentrok.)
;  2) NimBLE-Arduino -> backend BLE ringan yang dipakai library di atas saat
;     flag USE_NIMBLE aktif.
;  3) MPU9250 (hideakitai) -> driver sensor 9-axis MPU9250, API sederhana
;     (setup/update/getGyroX.. ) dan mendukung kalibrasi bias gyro.
; ---------------------------------------------------------------------------
lib_deps =
    https://github.com/Georgegipa/ESP32-BLE-Combo.git
    h2zero/NimBLE-Arduino @ ^1.4.1
    https://github.com/hideakitai/MPU9250.git
